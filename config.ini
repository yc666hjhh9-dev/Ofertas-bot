[bot]
; Tema privado de ntfy (no lo compartas: quien lo sepa puede leer tus avisos)
tema_ntfy =
servidor_ntfy = https://ntfy.sh

; Cada cuántas horas revisa (por defecto 6)
intervalo_horas = 6

; Precio máximo en euros para avisar de ofertas
precio_maximo_euros = 10
; Descuento mínimo (en %) para avisar de una oferta
descuento_minimo = 1
; Valoración mínima en Steam (% de reseñas positivas)
valoracion_minima_steam = 80
; Máximo de ofertas de Steam a vigilar en cada revisión
max_ofertas_steam = 60
; Máximo de avisos por revisión (el resto llega en la siguiente)
max_avisos_por_revision = 15

; Fuentes (si / no)
usar_epic = si
usar_steam = si
usar_gamerpower = si
; Avisar también de contenidos extra (DLC) gratis
incluir_dlc_gratis = no
